<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ecovission - احسب المسافة في مصر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #101514;
    --card: #1a201f;
    --card-2: #222927;
    --line: #2b3432;
    --text: #eef3f1;
    --muted: #8d9d98;
    --mint: #2de6a4;
    --mint-dark: #0b3b2c;
    --sun: #f2c94c;
    --down: #ff7a6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: 'Cairo', system-ui, sans-serif; color: var(--text); }
  #map { position: fixed; inset: 0; z-index: 0; }

  .panel {
    position: fixed; z-index: 1000; top: 16px; right: 16px;
    width: 350px; max-width: calc(100% - 32px); max-height: calc(100% - 32px); overflow-y: auto;
    background: var(--bg); border: 1px solid var(--line); border-radius: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
    padding: 14px; display: flex; flex-direction: column; gap: 10px;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  .head { display: flex; align-items: center; gap: 12px; padding: 4px 6px 6px; }
  .head img { width: 46px; height: auto; flex: none; }
  .head h1 { margin: 0; font-size: 22px; font-weight: 800; line-height: 1.2; letter-spacing: .2px; }
  .head p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }

  .stops { position: relative; }
  .stop { display: flex; align-items: center; gap: 12px; padding: 8px 0; font-size: 14.5px; color: var(--muted); transition: color .2s; }
  .stop .dot { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--line); flex: none; transition: all .2s; }
  .stop.active { color: var(--text); font-weight: 600; }
  .stop.active .dot { border-color: var(--mint); box-shadow: 0 0 0 5px rgba(45,230,164,.16); }
  .stop.done { color: var(--text); }
  .stop.done .dot { background: var(--mint); border-color: var(--mint); }
  .stop.end.done .dot { background: var(--sun); border-color: var(--sun); }
  .stop.end.active .dot { border-color: var(--sun); box-shadow: 0 0 0 5px rgba(242,201,76,.18); }
  .stops::before { content: ""; position: absolute; right: 23px; top: 34px; height: 24px; border-right: 2px dashed var(--line); }

  .rec { display: flex; flex-direction: column; gap: 2px; }
  .rec .tag { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--sun); font-weight: 600; }
  .rec .tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--sun); }
  .rec .name { font-size: 15.5px; font-weight: 800; line-height: 1.55; }
  .rec .addr { font-size: 12.5px; color: var(--muted); }
  .rec button { margin-top: 10px; }
  .rec .note { font-size: 12.5px; color: var(--sun); margin-top: 6px; }
  .rec .note:empty { display: none; }

  .result { display: none; flex-direction: column; gap: 10px; }
  .result.show { display: flex; animation: pop .35s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .big .label { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; justify-content: space-between; }
  .big .label::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--mint); }
  .big .num { font-size: 46px; font-weight: 800; line-height: 1.15; color: var(--text); font-variant-numeric: tabular-nums; }
  .big .num small { font-size: 17px; font-weight: 600; margin-right: 8px; color: var(--muted); }
  .row { display: flex; gap: 10px; }
  .row .card { flex: 1; padding: 11px 14px; }
  .row .label { font-size: 12px; color: var(--muted); }
  .row .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .row .val.accent { color: var(--sun); }
  .msg { font-size: 12.5px; color: var(--down); }
  .msg:empty { display: none; }

  .btn {
    display: block; width: 100%; padding: 12px; border: 0; border-radius: 14px; cursor: pointer;
    background: var(--mint); color: #05281d; font: 800 15px 'Cairo', sans-serif; transition: filter .15s, transform .1s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(.985); }
  .btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  .btn.ghost { background: var(--card-2); color: var(--text); border: 1px solid var(--line); font-weight: 600; }
  .btn[hidden] { display: none; }

  /* دبابيس مخصصة */
  .pin { width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 3px solid #101514; box-shadow: 0 4px 12px rgba(0,0,0,.45); }
  .pin.s { background: var(--mint); }
  .pin.e, .pin.d { background: var(--sun); }
  .pin::after { content: ""; position: absolute; inset: 7px; background: #101514; border-radius: 50%; }
  .leaflet-div-icon { background: none; border: 0; }

  /* عناصر Leaflet بنفس الستايل */
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--bg); color: var(--text); border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .leaflet-popup-content-wrapper { border-radius: 12px; }
  .leaflet-popup-content { font-family: 'Cairo', sans-serif; font-weight: 600; margin: 10px 14px; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
  .leaflet-bar { border: 1px solid var(--line) !important; border-radius: 12px !important; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,.35) !important; }
  .leaflet-bar a { background: var(--bg); color: var(--text); border-bottom: 1px solid var(--line); }
  .leaflet-bar a:hover { background: var(--card-2); color: var(--mint); }
  .leaflet-control-layers { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.35); font-family: 'Cairo', sans-serif; }
  .leaflet-control-layers-expanded { padding: 8px 12px; }
  .leaflet-control-layers label { margin: 4px 0; }
  .leaflet-control-layers input { accent-color: var(--mint); }
  .leaflet-control-layers-toggle { filter: invert(1) brightness(1.4); }
  .leaflet-control-attribution { background: rgba(16,21,20,.78) !important; color: var(--muted) !important; }
  .leaflet-control-attribution a { color: var(--mint) !important; }

  @media (max-width: 600px) {
    .panel { top: auto; bottom: 12px; right: 12px; left: 12px; width: auto; max-width: none; max-height: 62%; border-radius: 20px; }
    .big .num { font-size: 38px; }
  }
  @media (prefers-reduced-motion: reduce) { .result.show { animation: none; } .btn { transition: none; } }
</style>
</head>

      <div>
        <h1>ecovission</h1>
        <p>احسب المسافة: دوس على الخريطة وحدد بدايتك ونهايتك</p>
      </div>
    </div>

    <div class="card stops">
      <div class="stop start active" id="s1"><span class="dot"></span><span id="t1">دوس على الخريطة لتحديد نقطة البداية</span></div>
      <div class="stop end" id="s2"><span class="dot"></span><span id="t2">نقطة النهاية</span></div>
    </div>

    <div class="card rec" id="rec">
      <div class="tag">المكان المقترح</div>
      <div class="name">المعهد العالي للهندسة والتكنولوجيا بالبحيرة</div>
      <div class="addr">المهدية، أبو المطامير، محافظة البحيرة</div>
      <button type="button" class="btn" id="goDest" onclick="chooseDest()">اختاره كنقطة نهاية</button>
      <div class="note" id="recNote"></div>
    </div>

    <div class="result" id="result">
      <div class="card big">
        <div class="label">مسافة الطريق</div>
        <div class="num"><span id="roadKm">0</span><small>كم</small></div>
      </div>
      <div class="row">
        <div class="card"><div class="label">الوقت تقريباً</div><div class="val accent" id="mins">-</div></div>
        <div class="card"><div class="label">خط مستقيم</div><div class="val" id="straightKm">-</div></div>
      </div>
      <div class="msg" id="msg"></div>
    </div>

    <button class="btn ghost" id="resetBtn" hidden onclick="reset()">ابدأ من جديد</button>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // الخريطة متمركزة على مصر
    const map = L.map('map', { zoomControl: false }).setView([26.8, 30.8], 6);
    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    // خرائط من غير API key
    // خريطة فاتحة (شبه Positron) من Esri - من غير API key
    const esriBase = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
    const light = L.layerGroup([
      L.tileLayer(esriBase + 'World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri', maxNativeZoom: 16, maxZoom: 19 }),
      L.tileLayer(esriBase + 'World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom: 16, maxZoom: 19 })
    ]);
    const esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri', maxZoom: 19
    }).addTo(map);
    const topo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri', maxZoom: 19
    });
    // قمر صناعي + أسماء الشوارع والأماكن
    const ref = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
    const hybrid = L.layerGroup([
      L.tileLayer(ref + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri', maxZoom: 19 }),
      L.tileLayer(ref + 'Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }),
      L.tileLayer(ref + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 })
    ]);
    L.control.layers({ 'شوارع واضحة (Esri)': esri, 'طبوغرافي (Esri Topo)': topo, 'قمر صناعي + أسماء': hybrid, 'فاتح (Light Gray)': light }, null, { position: 'bottomleft' }).addTo(map);

    const pinIcon = (cls) => L.divIcon({
      className: '',
      html: `<div class="pin ${cls}" style="position:relative"></div>`,
      iconSize: [30, 30], iconAnchor: [4, 30], popupAnchor: [11, -30]
    });

    // المكان المقترح: المعهد العالي للهندسة والتكنولوجيا بالبحيرة
    const DEST = { name: 'المعهد العالي للهندسة والتكنولوجيا بالبحيرة', lat: 30.900574, lng: 29.875266 };
    const destMarker = L.marker([DEST.lat, DEST.lng], { icon: pinIcon('d') }).addTo(map).bindPopup(DEST.name);
    destMarker.on('click', () => chooseDest());

    let startMarker = null, endMarker = null, routeLine = null;
    const $ = (id) => document.getElementById(id);

    function setSteps(state) {
      const s1 = $('s1'), s2 = $('s2');
      s1.className = 'stop start' + (state === 0 ? ' active' : ' done');
      s2.className = 'stop end' + (state === 1 ? ' active' : state === 2 ? ' done' : '');
    }

    async function chooseDest() {
      if (!startMarker) {
        $('recNote').textContent = 'حدد نقطة البداية على الخريطة الأول، وبعدين اختار المعهد.';
        return;
      }
      if (endMarker === destMarker) return;
      if (endMarker) { map.removeLayer(endMarker); }
      if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
      endMarker = destMarker;
      $('recNote').textContent = '';
      $('t2').textContent = 'الوجهة: المعهد العالي للهندسة والتكنولوجيا بالبحيرة';
      setSteps(2);
      await calculateDistance();
    }

    map.on('click', async (e) => {
      const { lat, lng } = e.latlng;

      // أول ضغطة = بداية
      if (!startMarker) {
        startMarker = L.marker([lat, lng], { icon: pinIcon('s') }).addTo(map).bindPopup('البداية').openPopup();
        $('t1').textContent = 'تم تحديد نقطة البداية';
        $('t2').textContent = 'دلوقتي حدد نقطة النهاية';
        setSteps(1);
        $('resetBtn').hidden = false;
        $('recNote').textContent = '';
        return;
      }

      // تاني ضغطة = نهاية
      if (!endMarker) {
        endMarker = L.marker([lat, lng], { icon: pinIcon('e') }).addTo(map).bindPopup('النهاية').openPopup();
        $('t2').textContent = 'تم تحديد نقطة النهاية';
        setSteps(2);
        await calculateDistance();
        return;
      }

      // ضغطة تالتة = reset
      reset();
    });

    async function calculateDistance() {
      const s = startMarker.getLatLng();
      const e = endMarker.getLatLng();

      // 1) خط مستقيم
      const straightKm = (map.distance(s, e) / 1000).toFixed(2);
      $('straightKm').textContent = straightKm + ' كم';
      $('msg').textContent = '';

      // 2) على الطريق الفعلي (OSRM) - ملاحظة: lng قبل lat
      const url = `https://router.project-osrm.org/route/v1/driving/${s.lng},${s.lat};${e.lng},${e.lat}?overview=full&geometries=geojson`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const route = data.routes[0];
        const roadKm = (route.distance / 1000).toFixed(2);
        const minutes = Math.round(route.duration / 60);

        routeLine = L.geoJSON(route.geometry, { style: { color: '#2de6a4', weight: 6, opacity: .95 } }).addTo(map);
        map.fitBounds(routeLine.getBounds(), { padding: [60, 60] });

        $('roadKm').textContent = roadKm;
        $('mins').textContent = minutes >= 60 ? Math.floor(minutes / 60) + ' س ' + (minutes % 60) + ' د' : minutes + ' دقيقة';
      } catch (err) {
        $('roadKm').textContent = straightKm;
        $('mins').textContent = '-';
        $('msg').textContent = 'مقدرتش أجيب مسافة الطريق، الرقم الكبير هو الخط المستقيم.';
      }
      $('result').classList.add('show');
    }

    function reset() {
      [startMarker, endMarker === destMarker ? null : endMarker, routeLine].forEach(l => l && map.removeLayer(l));
    $('recNote').textContent = '';
      startMarker = endMarker = routeLine = null;
      $('t1').textContent = 'دوس على الخريطة لتحديد نقطة البداية';
      $('t2').textContent = 'نقطة النهاية';
      setSteps(0);
      $('result').classList.remove('show');
      $('resetBtn').hidden = true;
      map.setView([26.8, 30.8], 6);
    }
  </script>
</body>
</html>
